name: Auto Update Market Data

on:
  schedule:
    # ఇది సోమవారం నుండి శుక్రవారం వరకు ప్రతిరోజు ఉదయం 8:30 AM (IST) కి రన్ అవుతుంది
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # మాన్యువల్ గా కూడా రన్ చేసుకోవడానికి

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install yfinance pandas google-cloud-storage pyarrow fastparquet

      - name: Run Update Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_data.py
